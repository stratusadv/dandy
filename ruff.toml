indent-width = 4
line-length = 100
target-version = "py311"

exclude = [
    # The old docs site is read-only reference material (see AGENTS.md); it is
    # never linted, and its sample scripts are intentionally pre-v3 style.
    "archived_docs",
    # The eval harness is a self-contained package: its hidden tests are gated
    # by EVAL_TESTING and must not be touched by the repo's tooling.
    "evals",
    "*/migrations/*",
    "/site",
    ".DS_Store",
    ".eggs",
    ".git",
    ".hg",
    ".hypothesis",
    ".idea",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pybuilder",
    ".pytest_cache",
    ".pyre",
    ".pytype",
    ".ropeproject",
    ".scrapy",
    ".svn",
    ".tox",
    ".venv",
    ".venv*",
    ".venv_*",
    ".webassets-cache",
    "__pycache__",
    "__pypackages__",
    "build",
    "cover",
    "CVS",
    "develop-eggs",
    "dist",
    "docs/_build",
    "downloads",
    "eggs",
    "htmlcov",
    "instance",
    "lib",
    "lib64",
    "migrations",
    "node_modules",
    "parts",
    "profile_default",
    "sdist",
    "share/python-wheels",
    "target",
    "tmp/cache",
    "var",
    "venv",
    "venv*",
    "venv_*",
    "venv.bak",
    "wheels",
]

