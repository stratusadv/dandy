    "ANN002",
    "ANN003",
    "ANN401",
    "BLE001",
    "C901",
    "COM812",
    "CPY001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D202",
    "D203",
    "D205",
    "D211",
    "D212",
    "D213",
    "D400",
    "D401",
    "D406",
    "D407",
    "D415",
    "D417",
    "ERA001",
    "FBT001",
    "FBT002",
    "G004",
    "I001",
    "INP001",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLW2901",
    "PT019",
    "PTH123",
    "RUF012",
    "Q000",
    "Q003",
    "S101",
    "S301",
    "S311",
    "S603",
    "SLF001",
    "T201",
    "UP015",
    "UP035",
]
fixable = ["ALL"]
unfixable = []
# The test suite is unittest-style by design (it must run under both pytest and
# `python -m unittest discover`), so ruff's pytest-style (PT) prescriptions do
# not apply to it.
per-file-ignores = {
    # The test suite is unittest-style by design (it must run under both pytest and
    # `python -m unittest discover`), so ruff's pytest-style (PT) prescriptions do
    # not apply to it. The style rules below are deliberately not enforced in
    # tests either: annotations on hundreds of unittest methods, mock lambdas,
    # and the intentional terminal glyphs in TUI assertions would be churn, not
    # quality. Real defects (F401/F841/F811, etc.) are still enforced.
    "tests/**" = [
        "ANN",
        "ARG",
        "EM",
        "FBT003",
        "PT",
        "LOG015",
        "N802",
        "N806",
        "PERF401",
        "PLC0415",
        "PYI034",
        "RUF001",
        "RUF013",
        "S108",
        "SIM117",
        "SLOT000",
        "TC001",
        "TRY003",
    ],
    # The ASCII banner is box-drawing art; trailing whitespace is structural.
    "dandy/interfaces/cli/tui/ascii.py" = ["W291"],
    # The sqlite queries are built from module-level constants plus bound
    # parameters only; the f-string interpolation is not a user-input vector.
    "dandy/infrastructure/cache/sqlite/cache.py" = ["S608"],
    # The question prompt deliberately uses the ❯ glyph (RUF001/2/3).
    "dandy/interfaces/cli/tui/tui.py" = ["RUF001", "RUF002", "RUF003"],
}
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true

[lint.isort]
known-first-party = ["system", "app"]

[lint.mccabe]
max-complexity = 6
