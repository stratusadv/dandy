site_name: Dandy AI Framework
site_description: A Python framework for structured LLM interaction, built on domain-driven design.
site_url: https://dandysoftware.com

repo_name: stratusadv/dandy
repo_url: https://github.com/stratusadv/dandy

copyright: Copyright (c) 2026 Stratus Advanced Technologies and Contributors

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Understanding Dandy:
      - What is Dandy: introduction/what_is_dandy.md
      - Design Principles: introduction/principles.md
  - Domain Model:
      - Ubiquitous Language: domain_model/glossary.md
      - Bounded Contexts: domain_model/contexts.md
      - Tactical Patterns: domain_model/tactical.md
  - Architecture:
      - Layering and Dependency Rules: architecture/layering.md
      - The Service Pattern: architecture/service_pattern.md
      - Anatomy of an LLM Call: architecture/data_flow.md
  - Decisions:
      - Conventions and Index: adr/README.md
      - "0005: Rebuild the docs site DDD-first": adr/0005-rebuild-docs-ddd-first.md
      - "0004: Tool handle signature is the schema": adr/0004-tool-handle-signature-as-schema.md
      - "0003: Hermetic test suite by default": adr/0003-hermetic-tests-by-default.md
      - "0002: Enforce the layering with import-linter": adr/0002-enforce-layering-with-import-linter.md
      - "0001: Adopt DDD layering": adr/0001-adopt-ddd-layering.md
  - Getting Started:
      - Installation: getting_started/installation.md
      - Quick Start: getting_started/quick_start.md
      - Configuration: getting_started/configuration.md
  - User Guide:
      - Intel: user_guide/intel.md
      - Prompts: user_guide/prompts.md
      - Bots: user_guide/bots.md
      - Options and Context: user_guide/options_and_context.md
      - Tool Calling: user_guide/tool_calling.md
      - Decoders: user_guide/decoders.md
      - Recording: user_guide/recording.md
      - Caching: user_guide/caching.md
      - Futures: user_guide/futures.md
      - The Coding Agent: user_guide/coding_agent.md
      - Error Handling: user_guide/error_handling.md
  - API Reference:
      - Shared Kernel: reference/shared.md
      - Domain Layer: reference/domain.md
      - Application Layer: reference/application.md
      - Infrastructure Layer: reference/infrastructure.md
      - Interfaces Layer: reference/interfaces.md
  - Migration:
      - 2.x to 3.0: migration/v2_to_v3.md
  - Changelog:
      - v3.0.0: changelog/v3.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_if_no_docstring: true
            docstring_style: sphinx
            docstring_section_style: list
            members_order: source
            merge_init_into_class: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/lightbulb
        name: "Switch to dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/lightbulb-outline
        name: "Switch to system preference"
  features:
    - toc.follow
    - navigation.tabs
    - navigation.footer
    - navigation.sections
  logo: 'static/img/dandy_icon_white_256.png'
  favicon: 'static/img/favicon.png'
